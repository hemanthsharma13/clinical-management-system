apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinic-api
  namespace: harbor-clinic
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clinic-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: clinic-api
    spec:
      containers:
        - name: api
          image: REGION-docker.pkg.dev/PROJECT/clinic/backend:REPLACE_TAG
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: clinic-config
            - secretRef:
                name: clinic-secrets
          env:
            - name: PROCESS_ROLE
              value: api
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
