# Copy to a local secret file and replace every value before applying.
# Do not commit the filled-in secret.
apiVersion: v1
kind: Secret
metadata:
  name: clinic-secrets
  namespace: harbor-clinic
type: Opaque
stringData:
  JWT_SECRET: REPLACE_WITH_AT_LEAST_32_CHARACTERS
  MONGODB_URI: mongodb+srv://USER:PASSWORD@cluster.example.mongodb.net/clinic
  RECEPTIONIST_PASSWORD: REPLACE_ME
  ADMIN_PASSWORD: REPLACE_ME
