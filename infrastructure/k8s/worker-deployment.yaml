apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinic-notification-worker
  namespace: harbor-clinic
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clinic-notification-worker
  template:
    metadata:
      labels:
        app: clinic-notification-worker
    spec:
      containers:
        - name: worker
          image: REGION-docker.pkg.dev/PROJECT/clinic/backend:REPLACE_TAG
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: clinic-config
            - secretRef:
                name: clinic-secrets
          env:
            - name: PROCESS_ROLE
              value: worker
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
